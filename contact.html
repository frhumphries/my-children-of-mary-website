<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get In Touch — The Children of Mary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');
        .heading-serif { font-family: 'Playfair Display', Georgia, serif; }
        .marian-blue { color: #1e3a5f; }
        .nav-link:hover { color: #1e3a5f; }
    </style>
</head>
<body class="bg-stone-50">
    <nav class="bg-white border-b border-stone-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6">
            <div class="flex justify-between items-center h-20">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-marian-blue rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-cross text-white text-xl"></i>
                    </div>
                    <a href="index.html" class="font-bold text-2xl heading-serif marian-blue">Children of Mary</a>
                </div>
                <div class="hidden md:flex items-center gap-8 text-sm font-medium">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="history.html" class="nav-link">History</a>
                    <a href="mission.html" class="nav-link">Mission</a>
                    <a href="patrons.html" class="nav-link">Patrons</a>
                    <a href="programs.html" class="nav-link">Programs</a>
                    <a href="devotion.html" class="nav-link">Devotion</a>
                    <a href="register.html" class="nav-link">Join Us</a>
                    <a href="contact.html" class="nav-link text-marian-blue font-semibold">Get In Touch</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-6 py-16">
        <div class="grid md:grid-cols-5 gap-12">
            <!-- Contact Info -->
            <div class="md:col-span-2">
                <span class="text-sm uppercase tracking-[3px] text-marian-blue font-semibold">Contact</span>
                <h1 class="text-5xl heading-serif mt-4 mb-8">Get In Touch</h1>
                
                <div class="space-y-6 text-sm">
                    <div>
                        <div class="font-semibold">Congregation of the Children of Mary</div>
                        <div class="text-stone-600 mt-1">2211 E Texas Ave<br>Alexandria, LA 71301</div>
                    </div>
                    
                    <div>
                        <a href="mailto:childrenofmary@example.com" class="text-marian-blue hover:underline">childrenofmary@example.com</a>
                    </div>
                </div>
            </div>

            <!-- Netlify Contact Form -->
            <div class="md:col-span-3">
                <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="bg-white p-8 rounded-3xl border border-stone-200">
                    <input type="hidden" name="form-name" value="contact">
                    <p class="hidden"><label>Don’t fill this out: <input name="bot-field"></label></p>

                    <div class="grid grid-cols-1 gap-6">
                        <div>
                            <label class="block text-sm font-medium mb-1.5">Your Name</label>
                            <input type="text" name="name" required class="w-full px-4 py-3 border border-stone-300 rounded-xl">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1.5">Email Address</label>
                            <input type="email" name="email" required class="w-full px-4 py-3 border border-stone-300 rounded-xl">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1.5">Subject</label>
                            <input type="text" name="subject" class="w-full px-4 py-3 border border-stone-300 rounded-xl">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1.5">Message</label>
                            <textarea name="message" rows="6" required class="w-full px-4 py-3 border border-stone-300 rounded-2xl"></textarea>
                        </div>
                    </div>

                    <button type="submit" 
                            class="mt-8 px-10 py-4 bg-marian-blue text-white font-semibold rounded-full hover:bg-[#162c48] transition-colors">
                        Send Message
                    </button>
                </form>
            </div>
        </div>
    </div>

    <footer class="bg-marian-blue text-white/90 mt-16">
        <div class="max-w-6xl mx-auto px-6 py-12 text-sm">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-y-4">
                <div>© 2026 Congregation of the Children of Mary</div>
                <div class="text-white/60">2211 E Texas Ave, Alexandria, LA 71301</div>
            </div>
        </div>
    </footer>
</body>
</html>
